<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project Info</title>
<link rel="stylesheet" href="/kit/kit.css">
<script>try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
<style>
	/* One app, three sections (Now | All stages | Artifacts); a desktop never scrolls. Full width. */
	html, body { height: 100%; overflow: hidden; }
	body { display: grid; grid-template-rows: auto minmax(0, 1fr); }
	.home-bar { flex-wrap: wrap; gap: 8px 14px; padding: 8px 20px; }
	.home-title { flex: 1 1 360px; min-width: 0; }
	.home-title h1 { font-size: clamp(1.1rem, 2.1vh, 1.4rem); line-height: 1.25; overflow-wrap: anywhere; }
	.home-title .sub { font-size: 14px; color: var(--dim); overflow-wrap: anywhere; }
	.bar-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px 10px; margin-left: auto; }
	.home { display: flex; flex-direction: column; gap: var(--gap); padding: var(--gap) 20px; width: 100%; min-height: 0; }
	.home[hidden] { display: none; }
	.home > * { flex-shrink: 0; }
	#view-now > .zoom-panel { flex: 1 1 0; min-height: 0; }
	/* Nothing to aim at until the page is laid out with its data and font: a button that jumps
	   after it appears makes a click land on nothing. */
	body.settling main, body.settling .bar-actions { visibility: hidden; }
	@media (max-width: 640px) {
		html, body { height: auto; overflow: visible; }
		body { display: block; }
		.home-bar { padding: 8px 16px; position: static; }
		.bar-actions { justify-content: flex-start; margin-left: 0; }
		.home { padding: 12px 16px 24px; }
		#view-now > .zoom-panel { flex: none; min-height: 360px; height: 60vh; }
	}
</style>
</head>
<body class="settling">
<header class="kit-bar home-bar">
	<div class="home-title"><h1 id="focus">Loading…</h1><div class="sub" id="updated"></div></div>
	<div class="bar-actions">
		<span id="stale"></span>
		<span id="needs"></span>
		<span id="alerts"></span>
		<nav class="pins" id="pins" aria-label="Pinned links"></nav>
		<nav class="seg" id="sections" aria-label="Section"><a href="/" data-route="now">Now</a><a href="/stages" data-route="stages">All stages</a><a href="/artifacts" data-route="artifacts">Artifacts</a></nav>
		<button class="icon-btn" id="theme" aria-label="Light or dark theme" data-tip="Light / dark"></button>
	</div>
</header>
<main class="home kit-birdseye" id="view-now" aria-label="Now">
	<!-- the plan panel (a zoom-pan canvas) is inserted here -->
	<section class="usage-strip" id="usage" aria-label="Usage"></section>
</main>
<main class="home kit-birdseye stages" id="view-stages" aria-label="All stages" hidden>
	<section class="stage-plans" id="stage-plans" aria-label="Plans"></section>
	<section class="stage-live" aria-label="Live">
		<div class="section-head"><h2>Live</h2><span class="fresh" id="fresh-stages"></span></div>
		<div class="live-tiles" id="live-tiles"></div>
	</section>
</main>
<main class="home kit-birdseye arts" id="view-artifacts" aria-label="Artifacts" hidden>
	<div class="arts-bar">
		<input type="search" id="arts-q" placeholder="Search…" aria-label="Search artifacts">
		<select id="arts-topic" aria-label="Topic"></select>
		<div class="seg" id="arts-kind" role="group" aria-label="Kind"></div>
		<span class="fresh" id="fresh-arts"></span>
	</div>
	<div class="arts-wrap" id="arts-wrap"><table class="kit-table arts-table"><thead><tr><th>Artifact</th><th>Topic</th><th>Project</th><th>Kind</th><th>Updated</th></tr></thead><tbody id="arts-rows"></tbody></table></div>
	<div class="pager" id="arts-pager"><button data-prev>← Previous</button><span class="dim small" id="arts-info"></span><button data-next>Next →</button></div>
</main>
<script src="/kit/icons.js"></script>
<script src="/kit/kit.js"></script>
<script>
(() => {
	// ── helpers ──────────────────────────────────────────────────────────────
	const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => `&#${c.charCodeAt(0)};`);
	const $ = (id) => document.getElementById(id);
	const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
	const icon = (name, cls) => window.kitIcons?.svg(name, cls) || "";
	const parse = (iso) => { const t = iso ? Date.parse(iso) : NaN; return Number.isNaN(t) ? null : new Date(t); };
	/** "just now", "N min ago", "N h ago", "N d ago" (and "in N min" for the future). */
	const age = (s) => (s < 0 ? `in ${age(-s).replace(" ago", "")}` : s < 60 ? "just now" : s < 3600 ? `${Math.floor(s / 60)} min ago` : s < 86400 ? `${Math.floor(s / 3600)} h ago` : `${Math.floor(s / 86400)} d ago`);
	const local = (d) => d.toLocaleString("en-GB", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", timeZoneName: "short" });
	const utc = (d) => `${d.toISOString().slice(0, 16).replace("T", " ")} UTC`;
	const hhmm = (iso) => { const d = parse(iso); return d ? d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }) : "?"; };
	/** A relative time that stays honest (re-rendered every 10 s) with local + UTC time on hover. */
	const timeAgo = (iso, prefix = "", focusable = true) => {
		const d = parse(iso);
		if (!d) return `<span>${prefix ? `${esc(prefix)} ` : ""}not measured</span>`;
		return `<time datetime="${d.toISOString()}" data-prefix="${esc(prefix)}"${focusable ? ' tabindex="0"' : ""} data-tip="${esc(`${local(d)} · ${utc(d)}`)}">${esc(prefix ? `${prefix} ` : "")}${age((Date.now() - d) / 1000)}</time>`;
	};
	const tickTimes = () => { for (const t of document.querySelectorAll("time[datetime]")) { const p = t.dataset.prefix; t.textContent = `${p ? `${p} ` : ""}${age((Date.now() - Date.parse(t.dateTime)) / 1000)}`; } };
	const usd = (n) => (n == null ? "not measured" : `$${n.toFixed(2)}`);

	// A small hover / focus hint for icons and times ([data-tip]); the glossary keeps its own tooltip.
	let hint = null;
	const hideHint = () => { hint?.remove(); hint = null; };
	const showHint = (t) => {
		hideHint();
		hint = el("div", "kit-hint");
		hint.setAttribute("role", "tooltip");
		hint.textContent = t.dataset.tip;
		document.body.appendChild(hint);
		const r = t.getBoundingClientRect();
		const left = Math.min(Math.max(8, r.left + r.width / 2 - hint.offsetWidth / 2), innerWidth - hint.offsetWidth - 8);
		const top = r.bottom + 6 + hint.offsetHeight > innerHeight - 8 ? r.top - hint.offsetHeight - 6 : r.bottom + 6;
		hint.style.left = `${left}px`;
		hint.style.top = `${top}px`;
	};
	document.addEventListener("mouseover", (e) => { const t = e.target.closest?.("[data-tip]"); if (t) showHint(t); });
	document.addEventListener("mouseout", (e) => { if (e.target.closest?.("[data-tip]")) hideHint(); });
	document.addEventListener("focusin", (e) => { const t = e.target.closest?.("[data-tip]"); if (t && t.matches(":focus-visible")) showHint(t); else hideHint(); });
	document.addEventListener("focusout", hideHint);
	document.addEventListener("pointerdown", hideHint, true);

	// ── plan status (the same rules as the plan API) ─────────────────────────
	const STATUS_TEXT = { done: "Done", running: "Running", waiting: "Waiting", owner: "Needs you", not_started: "Not started", failed: "Failed" };
	const chip = (s) => `<span class="plan-chip" data-status="${esc(s)}">${esc(STATUS_TEXT[s] || s)}</span>`;
	/** The most specific owner-blocked items in plan order: a parent counts only when no descendant is owner-blocked. */
	function ownerItems(p) {
		const out = [];
		const walk = (stepId, subs) => { for (const s of subs || []) { const before = out.length; walk(stepId, s.children); if (s.status === "owner" && out.length === before) out.push({ plan: p.id, stepId, subtaskId: s.id, title: s.title, question: s.question ?? null }); } };
		for (const st of p.steps) { const before = out.length; walk(st.id, st.subtasks); if (st.status === "owner" && out.length === before) out.push({ plan: p.id, stepId: st.id, subtaskId: null, title: st.name, question: st.question ?? null }); }
		return out;
	}
	const allOwners = () => plans.flatMap(ownerItems);
	function countSubtasks(subs) {
		let done = 0, total = 0;
		for (const s of subs || []) { if (s.children?.length) { const c = countSubtasks(s.children); done += c.done; total += c.total; } else { total++; if (s.status === "done") done++; } }
		return { done, total };
	}
	const stepNeedsOwner = (p, st) => st.status === "owner" || ownerItems({ ...p, steps: [st] }).length > 0;
	/** What the page knows about an answer to this question: sent (waiting for Claude) or delivered. */
	const answerOf = (q) => (q?.hash ? answers.by_qhash?.[q.hash] ?? null : null);
	const sentText = (a) => (!a ? "" : a.delivered_at ? `Answer delivered to Claude ${age((Date.now() - Date.parse(a.delivered_at)) / 1000)}` : "Answer sent · waiting for Claude");
	/** The question box in the task modal: a click opens the answer panel. */
	const questionHtml = (q, owner, ref) => {
		if (!q) return owner ? '<section class="task-question" data-missing><p class="task-q-label">Needs you</p><p class="task-q-text">No question was recorded. Ask the agent what it needs from you.</p></section>' : "";
		const a = answerOf(q);
		return `<section class="task-question"><p class="task-q-label">Your call</p><p class="task-q-text">${esc(q.text)}</p>${q.options?.length ? `<ol class="task-q-opts">${sortOpts(q.options).map((o) => `<li${o.recommended ? " data-rec" : ""}><span class="task-q-opt">${esc(o.label)}</span>${o.recommended ? '<span class="task-q-rec">Recommended</span>' : ""}${o.note ? `<span class="task-q-note">${esc(o.note)}</span>` : ""}</li>`).join("")}</ol>` : ""}
			<div class="task-q-actions"><button class="task-btn task-answer" data-answer="${esc(ref)}" aria-haspopup="dialog">Answer ›</button>${a ? `<span class="task-q-sent">${esc(sentText(a))}</span>` : ""}</div></section>`;
	};
	const sortOpts = (opts) => [...opts].sort((a, b) => Number(b.recommended) - Number(a.recommended));

	// ── graph layout: columns by dependency depth, edges = transitive reduction ─
	function depthOf(items) {
		const byId = new Map(items.map((s) => [s.id, s]));
		const depth = new Map();
		const visit = (id, seen) => {
			if (depth.has(id)) return depth.get(id);
			if (seen.has(id)) return 0; // a cycle is cut where it is found
			seen.add(id);
			const deps = (byId.get(id)?.depends_on || []).filter((d) => byId.has(d));
			const d = deps.length ? Math.max(...deps.map((p) => visit(p, seen) + 1)) : 0;
			depth.set(id, d);
			return d;
		};
		for (const s of items) visit(s.id, new Set());
		return depth;
	}
	function reaches(byId, from, target, seen = new Set()) {
		for (const d of byId.get(from)?.depends_on || []) { if (d === target) return true; if (!seen.has(d)) { seen.add(d); if (reaches(byId, d, target, seen)) return true; } }
		return false;
	}
	/** C feeds E through D: no direct C → E line. */
	function graphEdges(items) {
		const byId = new Map(items.map((s) => [s.id, s]));
		const edges = [];
		for (const s of items) { const deps = (s.depends_on || []).filter((d) => byId.has(d)); for (const d of deps) if (!deps.some((o) => o !== d && reaches(byId, o, d))) edges.push({ from: d, to: s.id }); }
		return edges;
	}
	const NODE_W = 240, GAP_X = 64, GAP_Y = 20, GRID_GAP_X = 24, RING = 8;
	/** Steps with no links between them: a grid whose column count gives the largest fitted zoom. */
	function gridCols(n, NODE_H, room) {
		if (!room || room.w <= 0 || room.h <= 0) return 1;
		let best = 1, bestK = -1;
		for (let c = 1; c <= n; c++) {
			const rows = Math.ceil(n / c);
			const w = c * NODE_W + (c - 1) * GRID_GAP_X + 2 * RING, h = rows * NODE_H + (rows - 1) * GAP_Y + 2 * RING;
			const k = Math.min(FIT_MAX, (room.w - 2 * FIT_PAD) / w, (room.h - 2 * FIT_PAD) / h);
			if (k > bestK + 1e-3) { best = c; bestK = k; }
		}
		return best;
	}
	/** Every node is inset by RING so its focus ring and glow are never cut by the viewport edge. */
	function planLayout(steps, NODE_H, room) {
		const { nodes, width, height } = steps.length > 1 && !graphEdges(steps).length ? gridLayout(steps, NODE_H, gridCols(steps.length, NODE_H, room)) : chainLayout(steps, NODE_H);
		for (const n of nodes) { n.x += RING; n.y += RING; }
		return { nodes, width: width + 2 * RING, height: height + 2 * RING };
	}
	function gridLayout(steps, NODE_H, cols) {
		const rows = Math.ceil(steps.length / cols);
		const nodes = steps.map((step, i) => ({ step, x: (i % cols) * (NODE_W + GRID_GAP_X), y: Math.floor(i / cols) * (NODE_H + GAP_Y) }));
		return { nodes, cols, width: cols * NODE_W + (cols - 1) * GRID_GAP_X, height: rows * NODE_H + (rows - 1) * GAP_Y };
	}
	/** Each later node sits at the mean height of its drawn parents, so skip edges clear it. */
	function chainLayout(steps, NODE_H) {
		const depth = depthOf(steps);
		const cols = [];
		for (const s of steps) (cols[depth.get(s.id) ?? 0] ??= []).push(s);
		const filled = Array.from(cols, (c) => c ?? []);
		const tallest = Math.max(1, ...filled.map((c) => c.length));
		const height = tallest * NODE_H + (tallest - 1) * GAP_Y;
		const parents = new Map();
		for (const e of graphEdges(steps)) parents.set(e.to, [...(parents.get(e.to) || []), e.from]);
		const ys = new Map();
		const nodes = [];
		filled.forEach((col, ci) => {
			const colH = col.length * NODE_H + (col.length - 1) * GAP_Y;
			const wanted = col.map((step, ri) => {
				const ups = (parents.get(step.id) || []).map((p) => ys.get(p)).filter((y) => y !== undefined);
				const centred = (height - colH) / 2 + ri * (NODE_H + GAP_Y);
				return { step, y: ci > 0 && ups.length ? ups.reduce((a, b) => a + b, 0) / ups.length : centred };
			});
			wanted.sort((a, b) => a.y - b.y);
			for (let i = 1; i < wanted.length; i++) wanted[i].y = Math.max(wanted[i].y, wanted[i - 1].y + NODE_H + GAP_Y);
			const overflow = wanted.length ? wanted[wanted.length - 1].y - (height - NODE_H) : 0;
			for (const w of wanted) { const y = Math.max(0, w.y - Math.max(0, overflow)); ys.set(w.step.id, y); nodes.push({ step: w.step, x: ci * (NODE_W + GAP_X), y }); }
		});
		return { nodes, width: filled.length * NODE_W + Math.max(0, filled.length - 1) * GAP_X, height };
	}
	const arrowPath = (x1, y1, x2, y2) => { const mid = (x1 + x2) / 2; return `M${x1},${y1} C${mid},${y1} ${mid},${y2} ${x2 - 2},${y2}`; };
	const marker = (id) => `<defs><marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="plan-arrow-head"/></marker></defs>`;

	// ── zoom and pan: fit to view (100–160%, never below 100%), wheel, drag, + - 0 ─
	const FIT_PAD = 16, FIT_MIN = 1, FIT_MAX = 1.6, ZOOM_MIN = 0.4, ZOOM_MAX = 3, ZOOM_STEP = 1.25, DRAG_PX = 4;
	const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
	function zoomPan({ title, label, legend = "", onResize = null }) {
		const panel = el("section", "zoom-panel");
		panel.setAttribute("aria-label", title || label);
		panel.innerHTML = `<div class="zoom-panel-head">${title ? `<h2 class="zoom-panel-title">${esc(title)}</h2>` : ""}<span class="zoom-legend">${legend}</span>
			<div class="zoom-controls" role="group" aria-label="Zoom"><span class="zoom-level"></span>
			<button class="zoom-btn" data-z="out" aria-label="Zoom out" data-tip="Zoom out (−)">${icon("zoom-out")}</button>
			<button class="zoom-btn" data-z="in" aria-label="Zoom in" data-tip="Zoom in (+)">${icon("zoom-in")}</button>
			<button class="zoom-btn" data-z="fit" aria-label="Fit to view" data-tip="Fit to view (0)">${icon("maximize")}</button></div></div>
			<div class="zoom-viewport" data-pan tabindex="0" aria-label="${esc(label)}. Plus and minus zoom, 0 fits, drag to pan."><div class="zoom-scene" role="group" aria-label="${esc(label)}"></div></div>`;
		const vp = panel.querySelector(".zoom-viewport");
		const scene = panel.querySelector(".zoom-scene");
		let w = 1, h = 1, size = null, fitted = true, view = { k: 1, tx: 0, ty: 0 };
		const apply = () => {
			scene.style.transform = `translate(${view.tx}px, ${view.ty}px) scale(${view.k})`;
			panel.querySelector(".zoom-level").textContent = `${Math.round(view.k * 100)}%`;
			panel.querySelector('[data-z="fit"]').setAttribute("aria-pressed", String(fitted));
			vp.dataset.fitted = String(fitted);
		};
		/** An oversized scene starts at its top-left at 100% and pans, rather than shrinking text under the floor. */
		const fitView = () => {
			const k = clamp(Math.min((size.w - 2 * FIT_PAD) / w, (size.h - 2 * FIT_PAD) / h), FIT_MIN, FIT_MAX);
			const place = (room, s) => (s * k + 2 * FIT_PAD > room ? FIT_PAD : (room - s * k) / 2);
			return { k, tx: place(size.w, w), ty: place(size.h, h) };
		};
		const fit = () => { fitted = true; if (size) view = fitView(); apply(); };
		const zoomBy = (f, cx, cy) => {
			if (!size) return;
			cx ??= size.w / 2; cy ??= size.h / 2;
			fitted = false;
			const k = clamp(view.k * f, ZOOM_MIN, ZOOM_MAX);
			const r = k / view.k;
			view = { k, tx: cx - (cx - view.tx) * r, ty: cy - (cy - view.ty) * r };
			apply();
		};
		new ResizeObserver((es) => { const r = es[0].contentRect; size = { w: r.width, h: r.height }; if (fitted) fit(); onResize?.(size); }).observe(vp);
		// A native, non-passive listener: the page's own pinch-zoom must not fire.
		vp.addEventListener("wheel", (e) => { e.preventDefault(); const r = vp.getBoundingClientRect(); zoomBy(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
		let drag = null, suppress = false;
		vp.addEventListener("pointerdown", (e) => { if (e.button === 0) drag = { x: e.clientX, y: e.clientY, tx: view.tx, ty: view.ty, moved: false }; });
		vp.addEventListener("pointermove", (e) => {
			if (!drag) return;
			const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
			if (!drag.moved && Math.hypot(dx, dy) < DRAG_PX) return;
			drag.moved = true; fitted = false;
			view = { ...view, tx: drag.tx + dx, ty: drag.ty + dy };
			apply();
		});
		const end = () => { if (drag?.moved) suppress = true; drag = null; };
		vp.addEventListener("pointerup", end);
		vp.addEventListener("pointerleave", end);
		// A pan of 4 px or more never opens the node it started on.
		vp.addEventListener("click", (e) => { if (!suppress) return; suppress = false; e.stopPropagation(); e.preventDefault(); }, true);
		panel.addEventListener("keydown", (e) => {
			if (e.target.closest("input, textarea")) return;
			if (e.key === "+" || e.key === "=") zoomBy(ZOOM_STEP);
			else if (e.key === "-" || e.key === "_") zoomBy(1 / ZOOM_STEP);
			else if (e.key === "0") fit();
			else return;
			e.preventDefault();
		});
		panel.querySelector(".zoom-controls").addEventListener("click", (e) => {
			const b = e.target.closest("[data-z]");
			if (!b) return;
			if (b.dataset.z === "fit") fit(); else zoomBy(b.dataset.z === "in" ? ZOOM_STEP : 1 / ZOOM_STEP);
		});
		apply();
		return { panel, scene, legend: panel.querySelector(".zoom-legend"), room: () => size ?? { w: vp.clientWidth, h: vp.clientHeight }, setScene: (nw, nh) => { w = Math.max(1, nw); h = Math.max(1, nh); scene.style.width = `${w}px`; scene.style.height = `${h}px`; if (fitted) fit(); else apply(); } };
	}

	// ── state ────────────────────────────────────────────────────────────────
	const PHONE = matchMedia("(max-width: 640px)");
	let data = { projects: [], artifacts: [] };
	let now = null;
	let plans = [];
	let defaultPlanId = null;
	let planId = null;
	let pinned = [];
	let usage = { data: { claude: null, fireworks: null, glm: null }, sources: [] };
	let activity = { data: { reports: [], handoffs: [], commits: [], agents: [] }, sources: [] };
	let answers = { by_qhash: {}, unread: 0 };
	let health = null;
	let loaded = false;
	const projectTitle = (id) => data.projects.find((p) => p.id === id)?.title ?? id;
	const plan = () => plans.find((p) => p.id === planId) || plans[0] || { id: "current", steps: [] };
	const PLAN_KEY = "info.plan";

	// ── routes and the hash: /, /stages, /artifacts; #plan=<id>, #stage=<plan>.<step>, #detail=<key> ─
	const ROUTES = { "/": "now", "/index.html": "now", "/stages": "stages", "/artifacts": "artifacts" };
	let route = ROUTES[location.pathname] || "now";
	const hashParams = () => new URLSearchParams(location.hash.slice(1));
	/** Sets (or clears, value null) hash parameters on the current history entry. */
	function setHash(changes) {
		const h = hashParams();
		for (const [k, v] of Object.entries(changes)) { if (v == null) h.delete(k); else h.set(k, v); }
		const s = h.toString();
		history.replaceState(history.state, "", `${location.pathname}${s ? `#${s}` : ""}`);
	}
	function showRoute(r, push) {
		if (push && ROUTES[location.pathname] !== r) history.pushState({ route: r }, "", `${{ now: "/", stages: "/stages", artifacts: "/artifacts" }[r]}${planId ? `#plan=${encodeURIComponent(planId)}` : ""}`);
		route = r;
		for (const v of ["now", "stages", "artifacts"]) $(`view-${v}`).hidden = v !== r;

			{

	$("usage").addEventListener("click", (e) => { const b = e.target.closest("[data-detail]"); if (b) openDetail(b.dataset.detail, b); });

	// ── detail modals (usage groups, activity): Sources badges on top, a visual first, #detail=<key> ─
	const sourceBadges = (list) => `<span class="src-badges" aria-label="Sources">${list.map((s) => `<span class="src-badge" data-ok="${s.ok && !s.stale}" tabindex="0" data-tip="${esc(s.error || (s.as_of_utc ? `as of ${local(new Date(s.as_of_utc))}` : "not read yet"))}">${icon(s.ok && !s.stale ? "circle-check" : "triangle-alert")}${esc(s.name)}</span>`).join("")}</span>`;
	const resets = (m) => (m?.resets_at ? `resets ${local(new Date(m.resets_at))}` : "reset time not measured");
	const bars = (rows) => `<div class="kit-visual"><div class="kit-bars">${rows.map((r) => `<div class="b"><span>${esc(r.label)}</span><span class="track"><span class="fill${r.level === "red" ? " alt" : r.level === "amber" ? " amb" : ""}" style="width:${r.pct == null ? 0 : Math.min(100, r.pct)}%"></span></span><span class="v">${esc(r.value)}</span></div>`).join("")}</div></div>`;
	const DETAILS = {
		claude: { title: "Claude usage", sources: () => [srcOf("claude-usage")].filter(Boolean), body: () => { const c = usage.data.claude; const ms = [c?.session, c?.weekly].filter(Boolean); return `${bars(ms.map((m) => ({ label: m.label, pct: m.percent, level: m.level, value: m.percent == null ? "not measured" : `${Math.round(m.percent)}%` })))}${ms.length ? `<ul class="detail-lines">${ms.map((m) => `<li><b>${esc(m.label)}</b>: ${esc(resets(m))}${esc(LEVEL_TEXT[m.level] || "")}</li>`).join("")}</ul>` : '<p class="task-muted">Not measured: no reading yet.</p>'}<p class="caption">Bars: share of the account's limit used; amber from 80%, red at 100%. Account-wide, the same in every workspace.</p>`; } },
		fireworks: { title: "Fireworks this week", sources: () => [srcOf("fw-cost.json")].filter(Boolean), body: () => { const f = usage.data.fireworks; if (!f) return '<p class="task-muted">Not configured.</p>'; const top = (f.by_model || []).slice(0, 5); return `${bars([{ label: f.project, pct: f.share_pct, level: f.level, value: `${usd(f.share_usd)} of ${usd(f.cap_usd)}` }, ...top.map((m) => ({ label: m.model, pct: f.cap_usd ? (100 * m.usd) / f.cap_usd : null, level: "ok", value: usd(m.usd) }))])}<ul class="detail-lines"><li><b>Total this week (incl. Weave)</b>: ${esc(usd(f.total_usd))}</li><li><b>Week</b>: ${esc(f.week_start_utc ? local(new Date(f.week_start_utc)) : "not measured")} → ${esc(f.resets_utc ? local(new Date(f.resets_utc)) : "not measured")}</li></ul><p class="caption">Bars: dollars against the weekly cap. ${esc(f.project)}'s share is set in content/usage.json.</p>`; } },
		glm: { title: "GLM / Z.ai usage", sources: () => [srcOf("glm-usage.json")].filter(Boolean), body: () => { const g = usage.data.glm; const ms = [g?.window, g?.weekly].filter(Boolean); return `${bars(ms.map((m) => ({ label: m.label, pct: m.percent, level: m.level, value: m.percent == null ? "not measured" : `${Math.round(m.percent)}%` })))}${ms.length ? `<ul class="detail-lines">${ms.map((m) => `<li><b>${esc(m.label)}</b>: ${esc(resets(m))}</li>`).join("")}${g?.tier ? `<li><b>Plan</b>: ${esc(g.tier)}</li>` : ""}</ul>` : '<p class="task-muted">Not measured: no reading yet.</p>'}<p class="caption">Bars: share of the subscription's limit used; amber from 80%, red at 100%.</p>`; } },
		activity: { title: "Activity (last 24 h)", sources: () => activity.sources || [], body: null },

	let detailOpen = null;
	function openDetail(key, opener) {
		const d = DETAILS[key];
		if (!d || detailOpen) return;
		const body = el("div", "detail");
		body.style.display = "contents";
		const head = el("div", "detail-head", sourceBadges(d.sources()));

		const layer = window.kit.openLayer(d.title, body, { cls: key === "activity" ? "detail-modal detail-tall" : "detail-modal", head, returnFocus: opener ? () => (opener.isConnected ? opener : document.querySelector(`[data-detail="${key}"]`)) : undefined, onClose: () => { detailOpen = null; } });

	/** Activity: tabs (Agents | Reports | Handoffs | Commits), each a paged list that fits, never a scroll. */
	function activityBody(body) {
		const a = activity.data || {};
		const tabs = [
			["agents", "Agents", a.agents || [], (r) => `<b>${esc(r.name)}</b> <span class="plan-chip" data-status="${r.state === "running" ? "running" : "not_started"}">${r.state === "running" ? "Running" : "Quiet"}</span><span class="act-sub">${esc(r.description || r.type || "")}</span>`],
			["reports", "Reports", a.reports || [], (r) => `<b>${esc(r.agent)}</b><span class="act-sub">${esc(r.name)}</span>`],
			["handoffs", "Handoffs", a.handoffs || [], (r) => `<b>${esc(r.agent)}</b><span class="act-sub">${esc(r.name)}</span>`],
			["commits", "Commits", a.commits || [], (r) => `<code>${esc(r.sha)}</code> ${esc(r.subject)}`],
		];
		let tab = tabs.find((t) => t[2].length)?.[0] || "agents";
		let page = 0;
		body.innerHTML = `${bars(tabs.map(([, label, rows]) => ({ label, pct: (100 * rows.length) / Math.max(1, ...tabs.map((t) => t[2].length)), level: "ok", value: String(rows.length) })))}
			<div class="view-toggle act-tabs" role="tablist">${tabs.map(([k, label, rows]) => `<button role="tab" data-tab="${k}">${label} (${rows.length})</button>`).join("")}</div>
			<ol class="act-list"></ol><div class="pager act-pager"><button data-prev>← Previous</button><span class="dim small act-info"></span><button data-next>Next →</button></div>`;
		const list = body.querySelector(".act-list");
		const draw = () => {
			const [, , rows, fmt] = tabs.find((t) => t[0] === tab);
			for (const b of body.querySelectorAll("[data-tab]")) b.setAttribute("aria-selected", String(b.dataset.tab === tab));
			if (!rows.length) { list.innerHTML = '<li class="task-muted">None in the last 24 h.</li>'; body.querySelector(".act-info").textContent = ""; body.querySelector("[data-prev]").disabled = body.querySelector("[data-next]").disabled = true; return; }
			// Rows of the tallest row's height; as many as the list's height holds, pages even by count.
			list.innerHTML = rows.map((r) => `<li>${fmt(r)} <span class="act-at">${timeAgo(r.at, "", false)}</span></li>`).join("");
			const GAP = 4;
			const need = Math.max(28, ...[...list.children].map((c) => c.offsetHeight));
			let fit = Math.max(1, Math.floor((list.clientHeight + GAP) / (need + GAP)));
			let pp;
			// Shrink until the fullest page really fits (rows wrap differently once alone on a page).
			for (;;) {
				pp = window.kit.pagePlan(rows.length, 1, fit);
				const big = pp.sizes.indexOf(Math.max(...pp.sizes));
				list.innerHTML = rows.slice(pp.starts[big], pp.starts[big] + pp.sizes[big]).map((r) => `<li>${fmt(r)} <span class="act-at">${timeAgo(r.at, "", false)}</span></li>`).join("");
				if (fit <= 1 || list.scrollHeight <= list.clientHeight + 1) break;
				fit--;
			}
			page = Math.min(Math.max(0, page), pp.pages - 1);
			list.innerHTML = rows.slice(pp.starts[page], pp.starts[page] + pp.sizes[page]).map((r) => `<li>${fmt(r)} <span class="act-at">${timeAgo(r.at, "", false)}</span></li>`).join("");
			body.querySelector(".act-info").textContent = `Page ${page + 1} of ${pp.pages} · ${rows.length} item${rows.length === 1 ? "" : "s"}`;
			body.querySelector("[data-prev]").disabled = page === 0;
			body.querySelector("[data-next]").disabled = page >= pp.pages - 1;
		};
		body.addEventListener("click", (e) => {
			const t = e.target.closest("[data-tab]");
			if (t) { tab = t.dataset.tab; page = 0; draw(); }
			if (e.target.closest("[data-prev]")) { page--; draw(); }
			if (e.target.closest("[data-next]")) { page++; draw(); }
		});
		requestAnimationFrame(draw);
		setTimeout(draw, 50);
	}

	// ── All stages: one row per plan, step boxes with done/total; live tiles ────
	function renderStages() {
		$("stage-plans").innerHTML = plans.filter((p) => p.steps.length).map((p) => {
			const doneSteps = p.steps.filter((s) => s.status === "done").length;
			const subs = p.steps.reduce((acc, s) => { const c = countSubtasks(s.subtasks); return { done: acc.done + c.done, total: acc.total + c.total }; }, { done: 0, total: 0 });
			return `<section class="stage-row" data-plan="${esc(p.id)}" aria-label="${esc(p.title || p.id)}">
				<div class="stage-head"><h2>${esc(p.title || p.id)}</h2><span class="stage-meta">${doneSteps} of ${p.steps.length} stages done${subs.total ? ` · ${subs.done}/${subs.total} subtasks` : ""} · ${timeAgo(p.updated, "updated")}</span>${ownerItems(p).length ? chip("owner") : ""}</div>
				<div class="stage-steps" style="--n:${p.steps.length}">${p.steps.map((st) => { const c = countSubtasks(st.subtasks); return `<button type="button" class="stage-tile" data-plan="${esc(p.id)}" data-step="${esc(st.id)}" data-status="${esc(st.status)}" data-owner="${stepNeedsOwner(p, st)}" data-active="${st.id === p.active}" aria-haspopup="dialog" aria-label="${esc(`${st.id} ${st.name}: ${STATUS_TEXT[st.status]}. Open task map`)}"><span class="stage-id">${esc(st.id)}</span><span class="stage-name">${esc(st.name)}</span><span class="plan-node-meta">${st.status === "running" ? '<span class="plan-run">Running</span>' : chip(st.status)}${c.total ? `<span class="plan-node-count">${c.done}/${c.total}</span>` : ""}</span>${c.total ? `<span class="stage-progress" aria-hidden="true"><span style="width:${(100 * c.done) / c.total}%"></span></span>` : ""}</button>`; }).join("")}</div></section>`;
		}).join("") || `<p class="plan-empty">${loaded ? "No plans yet: add content/plans/<id>.json." : "Loading the plans"}</p>`;
		const tiles = [
			...usageGroups().map((g) => ({ key: g.key, name: g.name, src: g.src, html: `<span class="u-meters">${g.html}</span>` })),
			{ key: "activity", name: "Activity (24 h)", src: (activity.sources || []).find((s) => !s.ok || s.stale), html: `<span class="act-counts">${[["agents", "agents"], ["reports", "reports"], ["handoffs", "handoffs"], ["commits", "commits"]].map(([k, l]) => `<span><b>${(activity.data?.[k] || []).length}</b> ${l}</span>`).join("")}</span>` },
		];
		$("live-tiles").innerHTML = tiles.map((t) => `<button type="button" class="kit-tile live-tile" data-detail="${t.key}" aria-haspopup="dialog"><span class="u-name">${esc(t.name)}${staleMark(t.src)}</span>${t.html}</button>`).join("");
		$("fresh-stages").innerHTML = freshness();
	}
	$("stage-plans").addEventListener("click", (e) => { const b = e.target.closest(".stage-tile"); if (b) openTask(b.dataset.plan, b.dataset.step, null, b); });
	$("live-tiles").addEventListener("click", (e) => { const b = e.target.closest("[data-detail]"); if (b) openDetail(b.dataset.detail, b); });
	/** "Live · updated <ago>" or "Stale: <sources>" over every source the page shows. */
	function freshness() {
		const list = [...(health?.sources || [])];
		if (!list.length) return "";
		const bad = list.filter((s) => s.stale && !/not configured/.test(s.error || ""));
		const newest = list.map((s) => s.as_of_utc).filter(Boolean).sort().pop();
		return bad.length
			? `<span class="fresh-badge" data-ok="false" tabindex="0" data-tip="${esc(bad.map((s) => `${s.name}: ${s.error || "not refreshed lately"}`).join(" · "))}">${icon("triangle-alert")}Stale: ${esc(bad.map((s) => s.name).join(", "))}</span>`
			: `<span class="fresh-badge" data-ok="true">${icon("circle-check")}Live · updated ${newest ? timeAgo(newest, "", false) : "now"}</span>`;
	}

	// ── Artifacts: search, topic, kind, a paged table that fits ────────────────
	const KINDS = [["", "All"], ["kit", "Kit"], ["verification", "Verification"], ["legacy", "Original layout"]];
	const kindOf = (a) => (a.topic === "verification" ? "verification" : a.kind === "legacy" ? "legacy" : "kit");
	const arts = { q: "", topic: "", kind: "", page: 0 };
	$("arts-kind").innerHTML = KINDS.map(([k, l]) => `<button data-kind="${k}" aria-pressed="${k === ""}">${l}</button>`).join("");
	const scheme = () => document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
	const artRow = (a) => `<tr data-id="${esc(a.id)}"><td><a class="art-title" href="/view/${esc(a.id)}#scheme=${scheme()}">${esc(a.title)}</a><span class="art-head">${esc(a.headline)}</span>${!a.modified ? `<span class="art-missing">Not built yet.${a.rebuild ? ` Rebuild with: <code>${esc(a.rebuild)}</code>` : ""}</span>` : ""}</td>
		<td><span class="kit-chip">${esc(a.topic)}</span></td><td>${esc(projectTitle(a.project))}</td><td>${esc(KINDS.find((k) => k[0] === kindOf(a))[1])}</td><td>${a.modified ? timeAgo(a.modified, "", false) : "file missing"}</td></tr>`;
	function renderArts() {
		const topics = [...new Set(data.artifacts.map((a) => a.topic))].sort();
		const sel = $("arts-topic");
		const want = ["", ...topics].map((t) => `<option value="${esc(t)}"${t === arts.topic ? " selected" : ""}>${esc(t || "All topics")}</option>`).join("");
		if (sel.innerHTML !== want) sel.innerHTML = want;
		for (const b of $("arts-kind").querySelectorAll("button")) b.setAttribute("aria-pressed", String(b.dataset.kind === arts.kind));
		$("fresh-arts").innerHTML = freshness();
		const items = data.artifacts
			.filter((a) => (!arts.topic || a.topic === arts.topic) && (!arts.kind || kindOf(a) === arts.kind) && (!arts.q || `${a.title} ${a.headline} ${a.topic} ${projectTitle(a.project)}`.toLowerCase().includes(arts.q)))
			.sort((a, b) => String(b.modified).localeCompare(String(a.modified)));
		const tbody = $("arts-rows");
		if (!items.length) {
			tbody.innerHTML = '<tr><td colspan="5" class="empty">Nothing matches.</td></tr>';
			$("arts-info").textContent = "0 artifacts";
			$("arts-pager").querySelector("[data-prev]").disabled = $("arts-pager").querySelector("[data-next]").disabled = true;
			return;
		}
		// Rows of the tallest row's height; as many as the box holds, pages even by count (kit.pagePlan).
		let pp = { pages: 1, sizes: [items.length], starts: [0] };
		if (!PHONE.matches) {
			tbody.innerHTML = items.map(artRow).join("");
			const rows = [...tbody.children];
			const need = Math.max(...rows.map((r) => r.offsetHeight));
			const head = $("arts-wrap").querySelector("thead").offsetHeight;
			const fit = Math.max(1, Math.floor(($("arts-wrap").clientHeight - head - 2) / need));
			pp = window.kit.pagePlan(items.length, 1, fit);
			tbody.style.setProperty("--row-h", `${need}px`);
		}
		arts.page = Math.min(Math.max(0, arts.page), pp.pages - 1);
		tbody.innerHTML = items.slice(pp.starts[arts.page], pp.starts[arts.page] + pp.sizes[arts.page]).map(artRow).join("");
		$("arts-pager").querySelector("[data-prev]").disabled = arts.page === 0;
		$("arts-pager").querySelector("[data-next]").disabled = arts.page >= pp.pages - 1;
		$("arts-info").textContent = `Page ${arts.page + 1} of ${pp.pages} · ${items.length} artifact${items.length === 1 ? "" : "s"}`;
	}
	$("arts-q").addEventListener("input", () => { arts.q = $("arts-q").value.trim().toLowerCase(); arts.page = 0; renderArts(); });
	$("arts-topic").addEventListener("change", () => { arts.topic = $("arts-topic").value; arts.page = 0; renderArts(); });
	$("arts-kind").addEventListener("click", (e) => { const b = e.target.closest("[data-kind]"); if (b) { arts.kind = b.dataset.kind; arts.page = 0; renderArts(); } });
	$("arts-pager").addEventListener("click", (e) => { if (e.target.closest("[data-prev]")) { arts.page--; renderArts(); } if (e.target.closest("[data-next]")) { arts.page++; renderArts(); } });

	// ── the task map: a centred, stacked modal per workstream ──────────────────
	const VIEW_KEY = "info.taskmap.view";
	const storedView = () => { try { return localStorage.getItem(VIEW_KEY) === "list" ? "list" : "map"; } catch { return "map"; } };
	const SUB_W = 264, SUB_MIN_H = 48, ROW_GAP = 6, INDENT = 22, GROUP_GAP = 24, COL_GAP = 56, LANE = 28;
	/** Top-level subtasks in columns by sibling depends_on; each group is its head with descendants stacked and indented. */
	function subtaskLayout(subs, SUB_H) {
		const depth = depthOf(subs);
		const cols = [];
		for (const s of subs) (cols[depth.get(s.id) ?? 0] ??= []).push(s);
		const nodes = [];
		let x = 0, height = 0;
		for (const col of Array.from(cols, (c) => c ?? [])) {
			if (!col.length) continue;
			col.forEach((head, gi) => {
				const rows = [];
				const flat = (s, level, parent) => { rows.push({ sub: s, level, parent }); for (const c of s.children || []) flat(c, level + 1, s.id); };
				flat(head, 0, null);
				const gx = x + gi * (SUB_W + GROUP_GAP);
				rows.forEach((r, ri) => { const ind = Math.min(r.level, 3) * INDENT; nodes.push({ ...r, x: gx + ind, y: LANE + ri * (SUB_H + ROW_GAP), w: SUB_W - ind }); });
				height = Math.max(height, LANE + rows.length * (SUB_H + ROW_GAP) - ROW_GAP);
			});
			x += col.length * SUB_W + (col.length - 1) * GROUP_GAP + COL_GAP;
		}
		return { nodes, width: Math.max(SUB_W, x - COL_GAP), height: Math.max(SUB_H, height) };
	}
	/** Adjacent heads get a direct arrow; one that would cross a box arcs over the lane above them. */
	function subArrow(a, b, SUB_H) {
		const x1 = a.x + a.w, y1 = a.y + SUB_H / 2;
		if (b.x - x1 <= COL_GAP + 1) return arrowPath(x1, y1, b.x, b.y + SUB_H / 2);
		return `M${a.x + a.w / 2},${a.y} V${LANE / 2} H${b.x + b.w / 2} V${b.y - 2}`;
	}
	function subtaskMap(host, subs, name, focusId) {
		const z = zoomPan({ label: `${name} task map` });
		host.appendChild(z.panel);
		const nodeHtml = (n) => `<div class="sub-node task-node" data-sub="${esc(n.sub.id)}" data-status="${esc(n.sub.status)}" data-level="${n.level}" data-owner="${n.sub.status === "owner"}"${n.sub.id === focusId ? " data-focus" : ""} tabindex="0"${n.sub.status === "owner" && n.sub.question ? ' role="button" aria-haspopup="dialog"' : ""}
			${n.sub.note ? `data-tip="${esc(n.sub.note)}"` : ""} style="width:${n.w}px"><span class="sub-title">${esc(n.sub.title)}</span>${chip(n.sub.status)}</div>`;
		const draft = subtaskLayout(subs, SUB_MIN_H);
		z.scene.innerHTML = draft.nodes.map(nodeHtml).join("");
		const subH = Math.max(SUB_MIN_H, ...[...z.scene.children].map((n) => Math.ceil(n.offsetHeight)));
		const { nodes, width, height } = subtaskLayout(subs, subH);
		const at = new Map(nodes.map((n) => [n.sub.id, n]));
		const lines = nodes.map((n) => { const p = n.parent ? at.get(n.parent) : null; return p ? `<path class="sub-tree-line" d="M${p.x + 11},${p.y + subH} V${n.y + subH / 2} H${n.x}"/>` : ""; });
		const arrows = graphEdges(subs).map((e) => { const a = at.get(e.from), b = at.get(e.to); return `<path class="plan-edge" data-done="${a.sub.status === "done"}" d="${subArrow(a, b, subH)}" marker-end="url(#sub-arrow)"/>`; });
		z.scene.insertAdjacentHTML("afterbegin", `<svg class="plan-edges" width="${width}" height="${height}" aria-hidden="true">${marker("sub-arrow")}${lines.join("")}${arrows.join("")}</svg>`);
		for (const n of nodes) Object.assign(z.scene.querySelector(`[data-sub="${CSS.escape(n.sub.id)}"]`).style, { left: `${n.x}px`, top: `${n.y}px`, height: `${subH}px` });
		z.setScene(width, height);
	}
	const subList = (subs, focusId, ref) => `<ul class="task-tree">${subs.map((s) => `<li class="task-node" data-status="${esc(s.status)}"${s.id === focusId ? " data-focus" : ""}>
		<div class="task-row"><span class="task-dot" data-status="${esc(s.status)}" aria-hidden="true"></span><span class="task-title">${esc(s.title)}</span>${chip(s.status)}</div>
		${s.status === "owner" ? questionHtml(s.question, true, `${ref}.${s.id}`) : ""}${s.note ? `<div class="task-note">${esc(s.note)}</div>` : ""}${s.children?.length ? subList(s.children, focusId, ref) : ""}</li>`).join("")}</ul>`;

	/** A small Markdown renderer for a report's index.md: headings, lists, code, tables, links, bold. */
	function markdown(md) {
		const inline = (t) => esc(t)
			.replace(/`([^`]+)`/g, "<code>$1</code>")
			.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
			.replace(/\[([^\]]+)\]\(((?:https?:\/\/|\/)[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
		const out = [];
		const lines = String(md).replace(/\r/g, "").split("\n");
		for (let i = 0; i < lines.length; i++) {
			const l = lines[i];
			if (/^```/.test(l)) { const code = []; for (i++; i < lines.length && !/^```/.test(lines[i]); i++) code.push(lines[i]); out.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`); continue; }
			const h = /^(#{1,6})\s+(.*)$/.exec(l);
			if (h) { const n = Math.min(3, h[1].length); out.push(`<h${n}>${inline(h[2])}</h${n}>`); continue; }
			if (/^\s*\|/.test(l)) { const rows = []; for (; i < lines.length && /^\s*\|/.test(lines[i]); i++) if (!/^\s*\|[\s:|-]+\|\s*$/.test(lines[i])) rows.push(lines[i].trim().replace(/^\||\|$/g, "").split("|")); i--; out.push(`<table>${rows.map((r, ri) => `<tr>${r.map((c) => (ri ? `<td>${inline(c.trim())}</td>` : `<th>${inline(c.trim())}</th>`)).join("")}</tr>`).join("")}</table>`); continue; }
			if (/^\s*([-*]|\d+\.)\s+/.test(l)) { const items = []; for (; i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i]); i++) items.push(`<li>${inline(lines[i].replace(/^\s*([-*]|\d+\.)\s+/, ""))}</li>`); i--; out.push(`<ul>${items.join("")}</ul>`); continue; }
			if (l.trim()) out.push(`<p>${inline(l)}</p>`);
		}
		return out.join("");
	}

	let taskOpen = null;
	function openTask(pid, stepId, focusId = null, opener = null) {
		const p = plans.find((x) => x.id === pid);
		const st = p?.steps.find((s) => s.id === stepId);
		if (!st || taskOpen) return;
		let mode = storedView();
		let showReport = false;
		const toggle = el("div", "view-toggle", `<button data-v="map">${icon("network")}Map</button><button data-v="list">${icon("list")}List</button>`);
		toggle.setAttribute("role", "group");
		toggle.setAttribute("aria-label", "Task view");
		const body = el("div", "task-map");
		body.style.display = "contents";
		const counts = countSubtasks(st.subtasks);
		const planRef = p.plan_file ? `Plan: ${p.plan_file}${st.plan_section ? ` › ${st.plan_section}` : ""}` : "";
		body.innerHTML = `${st.status === "owner" ? questionHtml(st.question, true, `${p.id}:${st.id}`) : ""}<div class="task-meta">${st.status === "running" ? '<span class="plan-chip" data-status="running">Running</span>' : chip(st.status)}
			${counts.total ? `<span class="task-muted">${counts.done} of ${counts.total} subtasks done</span>` : ""}
			<span class="task-muted">${st.updated ? timeAgo(st.updated, "updated") : "no update time"}</span>
			<span class="task-muted">${st.agent ? `agent ${esc(st.agent)}` : "no agent"}</span>
			${planRef ? `<span class="task-muted task-plan">${esc(planRef)}</span>` : ""}
			${st.link ? `<a href="${esc(st.link)}" class="task-link">Open page ›</a>` : ""}
			${st.report ? '<button class="task-btn" data-report aria-expanded="false">Latest report</button>' : '<span class="task-muted">No report yet</span>'}</div>
			${st.goal || st.waiting_on ? `<p class="task-goal">${esc(st.goal)}${st.waiting_on ? `<span class="task-wait"> Waiting on: ${esc(st.waiting_on)}.</span>` : ""}</p>` : ""}
			${st.note ? `<p class="task-muted" style="margin:0">${esc(st.note)}</p>` : ""}
			<div class="task-view"></div>`;
		const viewBox = body.querySelector(".task-view");
		const renderView = async () => {
			for (const b of toggle.querySelectorAll("button")) b.setAttribute("aria-pressed", String(b.dataset.v === mode));
			viewBox.dataset.mode = showReport ? "report" : mode;
			viewBox.innerHTML = "";
			const subs = st.subtasks || [];
			if (showReport && st.report) {
				viewBox.innerHTML = '<p class="task-muted">Loading the report…</p>';
				try {
					const r = await (await fetch(`/api/report?name=${encodeURIComponent(st.report)}`)).json();
					if (viewBox.dataset.mode === "report") viewBox.innerHTML = r.index_md ? `<div class="task-report">${markdown(r.index_md)}</div>` : `<p class="task-muted">Could not load the report${r.error ? `: ${esc(r.error)}` : ""}.</p>`;
				} catch { viewBox.innerHTML = '<p class="task-muted">Could not load the report.</p>'; }
			} else if (!subs.length) viewBox.innerHTML = '<p class="task-muted">No subtasks recorded yet.</p>';
			else if (mode === "map") subtaskMap(viewBox, subs, st.name, focusId);
			else viewBox.innerHTML = subList(subs, focusId, `${p.id}:${st.id}`).replace('<ul class="task-tree">', `<ul class="task-tree task-tree-root" aria-label="${esc(st.name)} subtasks">`);
		};
		toggle.addEventListener("click", (e) => {
			const b = e.target.closest("[data-v]");
			if (!b) return;
			mode = b.dataset.v;
			showReport = false;
			const rb = body.querySelector("[data-report]");
			if (rb) { rb.textContent = "Latest report"; rb.setAttribute("aria-expanded", "false"); }
			try { localStorage.setItem(VIEW_KEY, mode); } catch {}
			renderView();
		});
		body.addEventListener("click", (e) => {
			const ans = e.target.closest("[data-answer]");
			if (ans) { const [pp, rest] = ans.dataset.answer.split(":"); const [sid, sub] = rest.split("."); openAnswer(pp, sid, sub || null, () => ans); return; }
			const sn = e.target.closest(".sub-node[data-owner='true']");
			if (sn) { openAnswer(p.id, st.id, sn.dataset.sub, () => sn); return; }
			const rb = e.target.closest("[data-report]");
			if (!rb) return;
			showReport = !showReport;
			rb.textContent = showReport ? "Back to tasks" : "Latest report";
			rb.setAttribute("aria-expanded", String(showReport));
			renderView();
		});
		body.addEventListener("keydown", (e) => { const sn = e.target.closest?.(".sub-node[data-owner='true']"); if (sn && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openAnswer(p.id, st.id, sn.dataset.sub, () => sn); } });
		taskOpen = stepId;
		const node = () => opener?.isConnected ? opener : document.querySelector(`.plan-node[data-step="${CSS.escape(stepId)}"]`);
		// Nothing to map or read: a compact modal without the Map/List toggle, not a big empty one.
		const bare = !(st.subtasks || []).length && !st.report;
		setHash({ stage: null });
		const layer = window.kit.openLayer(`${st.id} · ${st.name}`, body, { cls: bare ? "task-modal task-bare" : "task-modal", head: bare ? undefined : toggle, returnFocus: node, onClose: () => { taskOpen = null; } });
		layer.dataset.task = stepId;
		setHash({ stage: `${p.id}.${st.id}` });
		renderView();
	}

	// ── the answer panel: a question with clickable options, Copy answer and Send to Claude ─
	const findItem = (pid, stepId, subId) => {
		const p = plans.find((x) => x.id === pid);
		const st = p?.steps.find((s) => s.id === stepId);
		if (!st) return null;
		if (!subId) return { p, st, item: st, title: st.name };
		const walk = (subs) => { for (const s of subs || []) { if (s.id === subId) return s; const c = walk(s.children); if (c) return c; } return null; };
		const sub = walk(st.subtasks);
		return sub ? { p, st, item: sub, title: sub.title } : null;
	};
	const lineOf = (stepId, subId, title, text) => `${stepId}${subId ? `.${subId}` : ""} ${title}: ${text}`;
	let answerOpen = false;
	function openAnswer(pid, stepId, subId, returnFocus) {
		const f = findItem(pid, stepId, subId);
		const q = f?.item.question;
		if (!f || !q || answerOpen) return;
		const opts = sortOpts(q.options || []);
		const body = el("div", "answer-panel");
		body.innerHTML = `<div class="ans-q"><p class="task-q-label">Needs you · ${esc(stepId)}${subId ? `.${esc(subId)}` : ""} ${esc(f.title)}</p><p class="task-q-text">${esc(q.text)}</p></div>
			<div class="ans-opts" role="radiogroup" aria-label="Your answer">
			${opts.map((o, i) => `<label class="ans-opt"${o.recommended ? " data-rec" : ""}><input type="radio" name="ans" value="${i}"><span class="ans-body"><span class="ans-label">${esc(o.label)}${o.recommended ? '<span class="task-q-rec">Recommended</span>' : ""}</span>${o.note ? `<span class="ans-note">${esc(o.note)}</span>` : ""}</span></label>`).join("")}
			<label class="ans-opt ans-other"><input type="radio" name="ans" value="other"${opts.length ? "" : " checked"}><span class="ans-body"><span class="ans-label">Other</span><textarea maxlength="500" rows="2" placeholder="Your answer, in your words" aria-label="Other answer"></textarea></span></label></div>
			<p class="ans-preview"><span class="task-muted">Answer:</span> <code class="ans-line"></code></p>
			<div class="ans-actions"><button class="task-btn" data-copy>${icon("copy")}Copy answer</button><button class="ans-send" data-send>${icon("send")}Send to Claude</button><span class="ans-status" role="status" aria-live="polite"></span></div>`;
		const status = body.querySelector(".ans-status");
		const send = body.querySelector("[data-send]");
		const ta = body.querySelector("textarea");
		const pick = () => {
			const v = body.querySelector("input[name=ans]:checked")?.value;
			if (v == null) return null;
			if (v === "other") { const t = ta.value.trim(); return t ? { choice: null, other: t, text: t } : null; }
			return { choice: opts[Number(v)].label, other: null, text: opts[Number(v)].label };
		};
		const sync = () => {
			const a = pick();
			body.querySelector(".ans-line").textContent = a ? lineOf(stepId, subId, f.title, a.text) : "pick an option or write one under Other";
			const prior = answerOf(q);
			send.disabled = !a || !!prior;
			body.querySelector("[data-copy]").disabled = !a;
			if (prior && !status.dataset.fresh) status.textContent = `${sentText(prior)} (sent ${hhmm(prior.at)}). To change it, copy a new answer into the chat.`;
		};
		body.addEventListener("change", sync);
		ta.addEventListener("input", () => { body.querySelector("input[value=other]").checked = true; sync(); });
		ta.addEventListener("focus", () => { body.querySelector("input[value=other]").checked = true; sync(); });
		body.querySelector("[data-copy]").addEventListener("click", async () => {
			const a = pick();
			if (!a) return;
			const line = lineOf(stepId, subId, f.title, a.text);
			try { await navigator.clipboard.writeText(line); status.textContent = "Copied: paste it into the chat."; }
			catch { status.textContent = "Copy failed: select the answer line above and copy it."; }
		});
		send.addEventListener("click", async () => {
			const a = pick();
			if (!a || send.disabled) return;
			send.disabled = true;
			status.dataset.fresh = "1";
			status.textContent = "Sending…";
			try {
				const r = await fetch("/api/answer", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ plan: pid, item: stepId, subtask: subId, question: q.text, choice: a.choice, other: a.other, qhash: q.hash }) });
				const j = await r.json().catch(() => ({}));
				if (r.ok) {
					answers.by_qhash = { ...answers.by_qhash, [q.hash]: { id: j.id, at: new Date().toISOString(), line: j.line, delivered_at: null } };
					status.textContent = `Answer sent · waiting for Claude. It reaches the next turn of the session in this workspace.`;
					renderBar(); renderPlan();
				} else {
					status.textContent = `Not sent: ${j.error || r.status}`;
					send.disabled = false;
				}
			} catch { status.textContent = "Not sent: the server is not reachable."; send.disabled = false; }
		});
		answerOpen = true;
		const layer = window.kit.openLayer(`Your call: ${f.title}`, body, { cls: "answer-modal", returnFocus, onClose: () => { answerOpen = false; } });
		layer.dataset.answer = `${pid}:${stepId}${subId ? `.${subId}` : ""}`;
		sync();
		(body.querySelector("input[name=ans]") || ta).focus({ preventScroll: true });
	}

	// ── rendering ──────────────────────────────────────────────────────────────
	function renderAll() {
		renderBar();
		renderStale();
		if (route === "now") { renderPlan(); renderUsage(); }
		if (route === "stages") renderStages();
		if (route === "artifacts") renderArts();
	}

	// ── data: each source on its own period, refetched when the tab regains focus ─
	const SOURCES = {
		plans: { url: "/api/plans", every: 30_000 },
		now: { url: "/api/now", every: 30_000 },
		artifacts: { url: "/api/artifacts", every: 60_000 },
		pinned: { url: "/api/pinned", every: 60_000 },
		usage: { url: "/api/usage", every: 300_000 },
		activity: { url: "/api/activity", every: 30_000, when: () => route === "stages" || detailOpen === "activity" },
		answers: { url: "/api/answers", every: 10_000 },
		health: { url: "/api/health", every: 5_000 },
	};
	const keys = {};
	const lastAt = {};
	async function get(name) {
		const r = await fetch(SOURCES[name].url);
		if (r.status === 503) throw new Error("warming up");
		return r.json();
	}
	/** Fetches the due sources (or `force`d ones); re-renders only on change, never under a click. */
	async function load(force = [], all = false) {
		if (document.hidden) return;
		const t = Date.now();
		const due = Object.keys(SOURCES).filter((n) => all || force.includes(n) || (!lastAt[n] || t - lastAt[n] >= SOURCES[n].every) && (!SOURCES[n].when || SOURCES[n].when() || !loaded));
		if (!due.length) return;
		try {
			const got = await Promise.all(due.map(async (n) => [n, await get(n)]));
			for (const [n] of got) lastAt[n] = t;
			// The first paint waits for the web font, so nothing moves after it shows (max 1.5 s).
			if (!loaded) await Promise.race([document.fonts?.ready, new Promise((r) => setTimeout(r, 1500))]);
			let changed = false;
			for (const [n, v] of got) {
				const k = JSON.stringify(n === "health" ? v.sources : v);
				if (k === keys[n]) { if (n === "health") health = v; continue; }
				keys[n] = k;
				changed = true;
				if (n === "plans") { plans = Array.isArray(v.plans) ? v.plans : []; defaultPlanId = v.default; }
				if (n === "now") now = v;
				if (n === "artifacts") data = v && Array.isArray(v.artifacts) ? v : { projects: [], artifacts: [] };
				if (n === "pinned") pinned = Array.isArray(v) ? v : [];
				if (n === "usage") usage = v;
				if (n === "activity") activity = v;
				if (n === "answers") answers = v;
				if (n === "health") health = v;
			}
			if (!planId || !plans.some((p) => p.id === planId)) {
				const fromHash = hashParams().get("plan");
				let stored = null;
				try { stored = localStorage.getItem(PLAN_KEY); } catch {}
				planId = [fromHash, defaultPlanId, stored].find((id) => id && plans.some((p) => p.id === id)) || plans[0]?.id || null;
			}
			const first = !loaded;
			if (changed && !window.kit?.busy?.()) { loaded = true; renderAll(); }
			else if (changed) { for (const n of due) { delete keys[n]; delete lastAt[n]; } } // try again on the next tick
			document.body.classList.remove("settling");
			if (first && loaded) openFromHash();
		} catch {
			document.body.classList.remove("settling");
			$("stale").innerHTML = `<span class="stale-chip">${icon("triangle-alert")} Server not reachable</span>`;
			setTimeout(() => load(), 1000);
		}
	}
	/** A deep link: #stage=<plan>.<step> opens its task map, #detail=<key> its detail modal. */
	function openFromHash() {
		const h = hashParams();
		const stage = h.get("stage");
		const detail = h.get("detail");
		if (stage) { const [pid, sid] = stage.split("."); if (plans.some((p) => p.id === pid)) { if (route === "now" && pid !== planId) selectPlan(pid); openTask(pid, sid); } }
		else if (detail && DETAILS[detail]) openDetail(detail);
	}
	let resizeTimer = 0;
	window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (loaded && route === "artifacts") renderArts(); }, 120); });
	const root = document.documentElement;
	const paintTheme = () => { const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; $("theme").innerHTML = icon(dark ? "sun" : "moon"); };
	$("theme").addEventListener("click", () => {
		const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
		root.dataset.theme = dark ? "light" : "dark";
		try { localStorage.setItem("theme", root.dataset.theme); } catch {}
		paintTheme();
		if (route === "artifacts") renderArts();
	});
	paintTheme();
	showRoute(route, false);
	renderPlan();
	load([], true);
	// Node and row sizes are measured in the real font: re-lay once the web font has loaded.
	document.fonts?.ready.then(() => { if (loaded) renderAll(); });
	setInterval(() => load(), 5000);
	setInterval(() => { if (!document.hidden) tickTimes(); }, 10000);
	// Refetch everything when the tab is shown again or the window regains focus.
	document.addEventListener("visibilitychange", () => load([], true));
	window.addEventListener("focus", () => load([], true));
})();
</script>
</body>
