<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Self-test for kit.js's fit: visual-check.ts sweeps #block's height so the bird's-eye lands within a
     fraction of a pixel of the window, and checks that no page that fits ever keeps a scrollbar. -->
<title>Kit fit fixture</title><link rel="stylesheet" href="/kit/kit.css"></head>
<body data-artifact="kit-fit-fixture">
<header class="kit-bar"><b>Kit fit fixture</b></header>
<main class="kit-page kit-birdseye">
<div class="kit-answer"><p>A bird's-eye whose height the check varies.</p><p>Each height must fit with no scrollbar.</p></div>
<div class="kit-visual"><div id="block" style="height:320px;background:var(--accent-soft);border-radius:6px"></div><p class="kit-caption">A block of a chosen height.</p></div>
<div class="kit-tiles">
<div class="kit-tile"><div class="big">1</div><div class="lbl">tile</div></div><div class="kit-tile"><div class="big">2</div><div class="lbl">tile</div></div>
<div class="kit-tile"><div class="big">3</div><div class="lbl">tile</div></div><div class="kit-tile"><div class="big">4</div><div class="lbl">tile</div></div>
<div class="kit-tile"><div class="big">5</div><div class="lbl">tile</div></div><div class="kit-tile"><div class="big">6</div><div class="lbl">tile</div></div>
</div>
</main>
<script src="/kit/kit.js"></script>
</body></html>
